  const get = id => document.getElementById(id);

  let map;

  function message(text) {
    get("status").textContent = text;
  }

  function coordinates(place) {
    return new kakao.maps.LatLng(
      Number(place.y),
      Number(place.x)
    );
  }

  // 서울 또는 고양인지 확인한다.
  function supported(place) {
    const address =
      place.address_name || place.road_address_name || "";

    return (
      /^(서울|서울특별시)\s/.test(address) ||
      /^(경기|경기도) 고양시\s/.test(address)
    );
  }

  // 핵심 수정: 이름의 유사성이 아니라 실제 장소 분류로 판단한다.
  function isVenue(place) {
    if (!supported(place)) return false;

    const name = place.place_name || "";
    const category = place.category_name || "";

    // 공연장과 같은 건물에 있어도 아래 시설은 제외한다.
    const excluded =
      /주차장|주차타워|충전소|충전기|스크린골프|골프장|골프연습장|헬스장|피트니스|수영장|체육관|운동장|경기장|테니스장|회의장|회의실|컨벤션|전시장|박람회장|매표소|출입구|입구|정문|후문|편의점|카페|커피|음식점|식당|레스토랑|매점|사무실|사무소|관리실|연습실|연습장|학원|교습소|주유소|화장실|영화관|박물관|미술관/;

    if (excluded.test(name) || excluded.test(category)) {
      return false;
    }

    // 분류의 마지막 단계만 확인한다.
    // 예: 문화,예술 > 문화시설 > 공연장,연극극장
    const leaf = category.split(">").pop().trim();

    const allowed = new Set([
      "공연장",
      "연극극장",
      "소극장",
      "콘서트홀",
      "라이브홀",
      "음악공연장",
      "뮤지컬극장",
      "오페라극장",
      "야외공연장"
    ]);

    return leaf
      .split(",")
      .some(part => allowed.has(part.trim()));
  }

  // 현재 선택한 지역 탭과 일치하는지 확인한다.
  function inRegion(place) {
    const address =
      place.address_name || place.road_address_name || "";

    if (region === "all") return true;
    if (region === "seoul") return /^서울/.test(address);

    return /고양시/.test(address);
  }

  // 검증한 공연장만 저장한다.
  function remember(place) {
    if (
      isVenue(place) &&
      place.id &&
      Number.isFinite(Number(place.x)) &&
      Number.isFinite(Number(place.y))
    ) {
      inventory.set(place.id, place);
    }

    knownVenues = [...inventory.values()];

    get("venueCount").textContent =
      knownVenues.filter(inRegion).length;
  }

  // 각 작업 목록에서 검색을 세 개씩 처리한다.
  async function runPool(items, task, alive = () => true) {
    let cursor = 0;

    await Promise.all(
      Array.from({ length: 3 }, async () => {
        while (cursor < items.length && alive()) {
          const item = items[cursor++];

          try {
            await task(item);
          } catch (error) {
            // 한 검색이 실패해도 다음 검색을 계속한다.
          }
        }
      })
    );
  }

  // 카카오 검색을 비동기 함수에서 사용할 수 있도록 만든다.
  function query(method, value, options = {}) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        reject(new Error("검색 응답 지연"));
      }, 12000);

      const service = new kakao.maps.services.Places();

      service[method](
        value,
        (data, status, pagination) => {
          clearTimeout(timer);

          if (status === kakao.maps.services.Status.OK) {
            resolve({ data, pagination });
          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            resolve({
              data: [],
              pagination: null
            });
          } else {
            reject(new Error("검색 실패"));
          }
        },
        options
      );
    });
  }

  // 직접 검색과 지역 확장 탐색 모두 같은 공연장 검사를 적용한다.
  async function keywordPages(keyword, alive = () => true) {
    const found = new Map();

    for (let page = 1; page <= 45 && alive(); page++) {
      const result = await query("keywordSearch", keyword, {
        size: 15,
        page: page
      });

      result.data.forEach(place => {
        if (isVenue(place)) {
          found.set(place.id, place);
        }
      });

      if (!result.pagination?.hasNextPage) {
        break;
      }
    }

    return [...found.values()];
  }

  // 카페와 지하철역은 선택한 공연장 반경 500m로 검색한다.
  async function nearby(code, center, token) {
    const found = new Map();

    for (let page = 1; page <= 45; page++) {
      if (token !== generation) return [];

      const result = await query("categorySearch", code, {
        location: center,
        radius: 500,
        sort: kakao.maps.services.SortBy.DISTANCE,
        size: 15,
        page: page
      });

      result.data.forEach(place => {
        const distance = Number(place.distance);

        if (
          place.distance !== "" &&
          Number.isFinite(distance) &&
          distance <= 500
        ) {
          found.set(place.id, place);
        }
      });

      if (!result.pagination?.hasNextPage) {
        break;
      }
    }

    return [...found.values()];
  }

  // 기존 지도 표시와 목록을 정리한다.
  function clearPlaces() {
    entries.forEach(entry => {
      entry.overlay.setMap(null);
    });

    entries = [];

    if (popup) popup.setMap(null);
    if (circle) circle.setMap(null);

    get("results").replaceChildren();
  }

  // 장소 상세 정보를 보여준다.
  function showDetail(place) {
    if (popup) popup.setMap(null);

    const box = document.createElement("div");
    box.className = "popup";

    const title = document.createElement("strong");
    title.textContent = place.place_name;

    const address = document.createElement("p");
    address.textContent =
      place.road_address_name || place.address_name;

    const link = document.createElement("a");
    link.textContent = "카카오맵에서 자세히 보기 ↗";
    link.href =
      "https://map.kakao.com/link/map/" +
      encodeURIComponent(place.id);
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    const close = document.createElement("button");
    close.className = "close";
    close.textContent = "×";
    close.setAttribute("aria-label", "닫기");

    close.onclick = () => {
      if (popup) popup.setMap(null);
    };

    box.append(close, title, address, link);

    popup = new kakao.maps.CustomOverlay({
      map: map,
      position: coordinates(place),
      content: box,
      yAnchor: 1.5,
      zIndex: 100
    });

    map.panTo(coordinates(place));
  }

  // 지도에 추가하는 단계에서도 공연장 여부를 검사한다.
  function addPlace(place, type) {
    if (type === "venue" && !isVenue(place)) return;

    const pin = document.createElement("button");

    pin.className = "pin symbol " + type;
    pin.innerHTML = icon(type);
    pin.title = place.place_name;
    pin.setAttribute("aria-label", place.place_name);

    const activate = () => {
      if (type === "venue") {
        selectVenue(place);
      } else {
        showDetail(place);
      }
    };

    pin.onclick = activate;

    const overlay = new kakao.maps.CustomOverlay({
      map: map,
      position: coordinates(place),
      content: pin,
      yAnchor: 1,
      zIndex: type === "venue" ? 20 : 5
    });

    entries.push({
      place: place,
      type: type,
      overlay: overlay,
      activate: activate
    });
  }

  // 목록과 지도 아이콘을 필터에 맞게 표시한다.
  function renderList() {
    get("results").replaceChildren();

    entries.forEach(entry => {
      const visible =
        mode === "venues" ||
        entry.type === "venue" ||
        filter === "all" ||
        filter === entry.type;

      entry.overlay.setMap(visible ? map : null);

      if (
        !visible ||
        (mode === "nearby" && entry.type === "venue")
      ) {
        return;
      }

      const item = document.createElement("li");

      const button = document.createElement("button");
      button.className = "card";

      const symbol = document.createElement("span");
      symbol.className = "symbol " + entry.type;
      symbol.innerHTML = icon(entry.type);

      const text = document.createElement("span");
      text.className = "text";

      const name = document.createElement("strong");
      name.textContent = entry.place.place_name;

      const address = document.createElement("small");
      address.textContent =
        entry.place.road_address_name ||
        entry.place.address_name;

      text.append(name, address);
      button.append(symbol, text);

      if (entry.type !== "venue") {
        const distance = document.createElement("span");
        distance.className = "distance";
        distance.textContent = entry.place.distance + "m";

        button.append(distance);
      }

      button.onclick = entry.activate;

      item.append(button);
      get("results").append(item);
    });
  }

  // 선택한 공연장 주변을 검색한다.
  async function selectVenue(place) {
    if (!isVenue(place)) {
      message(
        "공연장 분류가 확인되지 않아 제외한 장소예요."
      );
      return;
    }

    const token = ++generation;

    mode = "nearby";
    inventoryView = false;

    clearPlaces();

    get("venueName").textContent = place.place_name;
    get("venueAddress").textContent =
      place.road_address_name || place.address_name;

    const center = coordinates(place);

    map.setLevel(5);
    map.setCenter(center);

    circle = new kakao.maps.Circle({
      map: map,
      center: center,
      radius: 500,
      strokeWeight: 2,
      strokeColor: "#7652df",
      strokeOpacity: 0.65,
      strokeStyle: "dash",
      fillColor: "#a98af5",
      fillOpacity: 0.12
    });

    addPlace(place, "venue");

    message(
      "공연장 반경 500m의 카페와 지하철역을 찾고 있어요."
    );

    const results = await Promise.allSettled([
      nearby("CE7", center, token),
      nearby("SW8", center, token)
    ]);

    if (token !== generation) return;

    const types = ["cafe", "station"];
    const labels = ["카페", "지하철역"];
    const notes = [];

    results.forEach((result, index) => {
      if (result.status === "fulfilled") {
        result.value.forEach(item => {
          addPlace(item, types[index]);
        });

        notes.push(
          labels[index] + " " + result.value.length + "곳"
        );
      } else {
        notes.push(
          labels[index] +
          " 검색 실패 · 공연장을 다시 눌러 재시도"
        );
      }
    });

    entries.sort((first, second) => {
      return (
        Number(first.place.distance || 0) -
        Number(second.place.distance || 0)
      );
    });

    renderList();

    message(
      notes.join(" / ") +
      " · 카카오 검색 결과 기준입니다. " +
      "500m는 직선거리이며 역 출입구·도보거리와 다를 수 있어요."
    );
  }

  // 입력한 검색어에서도 공연장만 남긴다.
  async function searchVenues(keyword) {
    const token = ++generation;

    clearPlaces();

    mode = "venues";
    inventoryView = false;

    get("venueName").textContent =
      "검색 결과에서 공연장 선택";

    get("venueAddress").textContent =
      "공연장 분류가 확인된 장소만 표시합니다.";

    message("공연장을 검색하고 있어요.");

    try {
      const data = await keywordPages(
        keyword,
        () => token === generation
      );

      if (token !== generation) return;

      const places = data.filter(inRegion);

      places.forEach(place => {
        addPlace(place, "venue");
      });

      renderList();

      if (places.length) {
        map.setLevel(5);
        map.setCenter(coordinates(places[0]));

        message(
          "공연장으로 분류된 장소 " +
          places.length +
          "곳을 찾았어요. 원하는 공연장을 선택해 주세요."
        );
      } else {
        message(
          "공연장 분류가 확인된 결과가 없어요. " +
          "검색어 또는 지역 탭을 바꿔 보세요."
        );
      }
    } catch (error) {
      if (token === generation) {
        message(
          "공연장 검색에 실패했어요. 다시 시도해 주세요."
        );
      }
    }
  }

  // 기본 목록 갱신 시 지도 중심은 바꾸지 않는다.
  function refreshInventory() {
    if (!inventoryView || mode !== "venues") return;

    clearPlaces();

    knownVenues
      .filter(inRegion)
      .sort((first, second) => {
        return first.place_name.localeCompare(
          second.place_name,
          "ko"
        );
      })
      .forEach(place => {
        addPlace(place, "venue");
      });

    renderList();

    get("venueCount").textContent = entries.length;
  }

  // 공연장 목록으로 돌아간다.
  function showVenues() {
    ++generation;

    mode = "venues";
    inventoryView = true;

    get("venueName").textContent =
      "당신의 다음 무대를 찾아보세요";

    get("venueAddress").textContent =
      "카카오 장소 분류에서 확인된 공연장만 표시합니다.";

    refreshInventory();

    map.setLevel(5);

    const center = region === "goyang"
      ? new kakao.maps.LatLng(37.6586, 126.7733)
      : new kakao.maps.LatLng(37.5509, 126.9217);

    map.setCenter(center);

    message(
      "공연장을 선택하면 주변 500m의 카페와 지하철역을 보여드려요."
    );
  }

  // 지역별 검색으로 공연장을 추가한다.
  async function discover() {
    const id = ++scanId;
    const selected = get("district").value;

    const areas = selected === "all"
      ? districts.filter(area => {
          if (region === "all") return true;

          return region === "goyang"
            ? area.startsWith("고양")
            : area.startsWith("서울");
        })
      : [selected];

    const jobs = areas.flatMap(area => {
      return [
        "공연장",
        "라이브홀",
        "콘서트홀",
        "소극장"
      ].map(term => area + " " + term);
    });

    let done = 0;
    let failures = 0;

    get("discover").disabled = true;
    get("stopScan").hidden = false;

    get("scanStatus").textContent =
      "공연장으로 분류된 장소를 탐색하고 있어요.";

    await runPool(
      jobs,
      async keyword => {
        try {
          const places = await keywordPages(
            keyword,
            () => id === scanId
          );

          if (id !== scanId) return;

          places.forEach(remember);
        } catch (error) {
          failures++;
        }

        if (id !== scanId) return;

        done++;
        refreshInventory();

        get("scanStatus").textContent =
          "지역 탐색 " + done + "/" + jobs.length +
          " · 누적 " + inventory.size + "곳";
      },
      () => id === scanId
    );

    if (id !== scanId) return;

    get("discover").disabled = false;
    get("stopScan").hidden = true;

    get("scanStatus").textContent =
      "탐색 완료 · 공연장 " + inventory.size + "곳" +
      (
        failures
          ? " · 검색 실패 " + failures + "건, 재시도 가능"
          : ""
      ) +
      " · 카카오 검색 제공 범위 기준";
  }

  // 현재 위치를 표시한다.
  function locateUser() {
    if (!navigator.geolocation) {
      message(
        "이 브라우저는 위치 확인을 지원하지 않아요."
      );
      return;
    }

    const token = generation;
    const request = ++locationRequest;

    message(
      "위치 권한을 허용하면 현재 위치를 표시해요."
    );

    navigator.geolocation.getCurrentPosition(
      position => {
        if (request !== locationRequest) return;

        const center = new kakao.maps.LatLng(
          position.coords.latitude,
          position.coords.longitude
        );

        if (userMarker) userMarker.setMap(null);

        const dot = document.createElement("div");

        dot.className = "location-dot";
        dot.title = "현재 위치";

        userMarker = new kakao.maps.CustomOverlay({
          map: map,
          position: center,
          content: dot,
          zIndex: 30
        });

        if (token === generation) {
          map.setLevel(5);
          map.setCenter(center);

          message(
            "현재 위치를 표시했어요. 공연장을 선택해 보세요."
          );
        }
      },
      () => {
        if (token === generation) {
          message(
            "현재 위치를 확인하지 못했어요. " +
            "공연장 검색은 그대로 이용할 수 있어요."
          );
        }
      },
      {
        timeout: 10000,
        maximumAge: 0,
        enableHighAccuracy: true
      }
    );
  }

  // 지도와 화면을 준비한다.
  async function initialize() {
    map = new kakao.maps.Map(get("map"), {
      center: new kakao.maps.LatLng(37.5509, 126.9217),
      level: 5
    });

    [
      "searchButton",
      "locate",
      "reset",
      "discover"
    ].forEach(id => {
      get(id).disabled = false;
    });

    const shortcuts = [
      "스페이스 브릭",
      "무신사 개러지",
      "롤링홀",
      "프리즘홀",
      "고양아람누리",
      "고양어울림누리"
    ];

    // 바로가기도 검색 결과를 보여주어 정확한 공연장을 고르게 한다.
    shortcuts.forEach(name => {
      const button = document.createElement("button");

      button.className = "chip";
      button.textContent = name;

      button.onclick = () => {
        get("keyword").value = name;
        searchVenues(name);
      };

      get("presets").append(button);
    });

    get("searchForm").onsubmit = event => {
      event.preventDefault();

      const keyword = get("keyword").value.trim();

      if (keyword) searchVenues(keyword);
    };

    get("locate").onclick = locateUser;
    get("reset").onclick = showVenues;

    document.querySelectorAll("[data-type]").forEach(button => {
      button.onclick = () => {
        filter = button.dataset.type;

        document.querySelectorAll("[data-type]").forEach(item => {
          item.setAttribute(
            "aria-pressed",
            String(item === button)
          );
        });

        if (popup) popup.setMap(null);

        renderList();
      };
    });

    const observer = new ResizeObserver(() => {
      const center = map.getCenter();

      map.relayout();
      map.setCenter(center);
    });

    observer.observe(get("map"));

    districts.forEach(area => {
      const option = document.createElement("option");

      option.value = area;
      option.textContent = area;

      get("district").append(option);
    });

    document.querySelectorAll("[data-region]").forEach(button => {
      button.onclick = () => {
        region = button.dataset.region;

        document.querySelectorAll("[data-region]").forEach(item => {
          item.setAttribute(
            "aria-pressed",
            String(item === button)
          );
        });

        get("district").value = "all";

        Array.from(get("district").options).forEach(option => {
          option.hidden =
            option.value !== "all" &&
            region !== "all" &&
            (
              region === "goyang"
                ? !option.value.startsWith("고양")
                : !option.value.startsWith("서울")
            );
        });

        showVenues();
      };
    });

    get("discover").onclick = discover;

    get("stopScan").onclick = () => {
      ++scanId;

      get("discover").disabled = false;
      get("stopScan").hidden = true;

      get("scanStatus").textContent =
        "탐색을 중지했어요. 확인한 공연장은 유지됩니다.";
    };

    locateUser();

    let checked = 0;
    let failed = 0;

    // 기본 목록에도 동일한 엄격한 검사를 적용한다.
    await runPool(venueNames, async name => {
      try {
        const result = await query(
          "keywordSearch",
          name,
          { size: 15 }
        );

        result.data
          .filter(isVenue)
          .forEach(remember);
      } catch (error) {
        failed++;
      }

      checked++;
      refreshInventory();

      get("seedStatus").textContent =
        "후보 " + checked + "/" + venueNames.length +
        "개 조회 · 공연장 " + inventory.size + "곳 확인" +
        (
          failed
            ? " · 조회 실패 " + failed + "건"
            : ""
        );
    });

    get("seedStatus").textContent =
      "기본 검색 완료 · 공연장 분류가 확인된 장소만 포함했습니다." +
      (
        failed
          ? " 실패 " + failed + "건은 이름 검색으로 재시도해 주세요."
          : ""
      );
  }

  // SDK 로딩이 완료된 후에만 지도를 생성한다.
  const timer = setTimeout(() => {
    message(
      "지도 로딩이 지연되고 있어요. " +
      "JavaScript 키, 등록 도메인과 연결 상태를 확인해 주세요."
    );
  }, 15000);

  const script = document.createElement("script");

  script.src =
    "https://dapi.kakao.com/v2/maps/sdk.js" +
    "?appkey=827280b33d4bbb9a008d5d22e53ab631" +
    "&libraries=services&autoload=false";

  script.onerror = () => {
    clearTimeout(timer);

    message(
      "지도를 불러오지 못했어요. " +
      "카카오 키와 등록 도메인을 확인해 주세요."
    );
  };

  script.onload = () => {
    if (!window.kakao?.maps) {
      clearTimeout(timer);

      message(
        "지도 SDK를 사용할 수 없어요. " +
        "키와 도메인 설정을 확인해 주세요."
      );

      return;
    }

    kakao.maps.load(() => {
      clearTimeout(timer);

      initialize().catch(() => {
        message(
          "지도 초기화에 실패했어요. " +
          "새로고침 후 다시 시도해 주세요."
        );
      });
    });
  };

  document.head.append(script);
</script>
