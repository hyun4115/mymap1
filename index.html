  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카카오맵 장소 검색</title>

  <style>
    /* 모든 요소의 크기에 테두리와 안쪽 여백을 포함한다. */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #24324b;
    }

    /* 화면을 왼쪽 검색 영역과 오른쪽 지도로 나눈다. */
    .layout {
      display: flex;
      height: 100vh;
      height: 100dvh;
    }

    .sidebar {
      width: 340px;
      max-width: 48%;
      flex-shrink: 0;
      padding: 20px;
      overflow-y: auto;
      background: #f6f8fc;
      border-right: 1px solid #dbe2ec;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 23px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #bac6d7;
      border-radius: 8px;
      font: inherit;
    }

    button {
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #f4bc32;
    }

    #status {
      font-size: 14px;
      line-height: 1.6;
    }

    #results {
      list-style: none;
      padding: 0;
    }

    #results li {
      margin-bottom: 10px;
    }

    .place {
      width: 100%;
      text-align: left;
      background: white;
      color: #24324b;
      border: 1px solid #dbe2ec;
      line-height: 1.6;
    }

    .place:hover {
      background: #eaf1ff;
    }

    .place strong,
    .place span {
      display: block;
      overflow-wrap: anywhere;
    }

    .place span {
      font-size: 13px;
      color: #53627a;
    }

    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #edf1f5;
    }

    .info {
      max-width: 250px;
      padding: 12px;
      font-size: 14px;
    }

    /* 작은 화면에서도 좌우 배치를 유지한다. */
    @media (max-width: 600px) {
      .sidebar {
        padding: 12px;
      }

      h1 {
        font-size: 18px;
      }

      .search-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="layout">
    <!-- 왼쪽: 검색창과 검색 결과 -->
    <aside class="sidebar">
      <h1>장소 검색</h1>

      <form id="searchForm">
        <label for="keyword">어디를 찾고 있나요?</label>

        <div class="search-row">
          <input
            id="keyword"
            type="text"
            placeholder="예: 카페, 도서관"
            required
          >
          <button id="searchButton" type="submit" disabled>
            검색
          </button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다.
      </p>

      <ul id="results" aria-label="장소 검색 결과"></ul>
    </aside>

    <!-- 오른쪽: 지도 -->
    <div id="map" role="region" aria-label="카카오 지도"></div>
  </main>

  <script>
    // HTML 요소가 만들어진 뒤에 화면 요소를 가져온다.
    const searchForm = document.getElementById("searchForm");
    const searchButton = document.getElementById("searchButton");
    const keywordInput = document.getElementById("keyword");
    const statusText = document.getElementById("status");
    const resultList = document.getElementById("results");

    let map;
    let places;
    let infoWindow;
    let markers = [];
    let ready = false;
    let requestId = 0;

    // SDK 로딩이 실패하거나 지연되면 안내 문구를 표시한다.
    function showLoadError() {
      statusText.textContent =
        "지도 로딩 지연 또는 실패: 인터넷 연결, JavaScript 키, " +
        "등록 도메인과 카카오맵 사용 설정을 확인해 주세요.";
    }

    const loadTimer = setTimeout(showLoadError, 15000);

    // 지도 SDK를 불러온다. 장소 검색용 라이브러리도 함께 포함한다.
    const sdkScript = document.createElement("script");

    sdkScript.src =
      "https://dapi.kakao.com/v2/maps/sdk.js" +
      "?appkey=827280b33d4bbb9a008d5d22e53ab631" +
      "&libraries=services&autoload=false";

    sdkScript.onerror = () => {
      clearTimeout(loadTimer);
      showLoadError();
    };

    // SDK 파일 로딩 후, 지도 라이브러리까지 준비되면 실행한다.
    sdkScript.onload = () => {
      if (!window.kakao || !window.kakao.maps) {
        clearTimeout(loadTimer);
        showLoadError();
        return;
      }

      kakao.maps.load(() => {
        try {
          initializeMap();
          clearTimeout(loadTimer);
        } catch (error) {
          clearTimeout(loadTimer);
          showLoadError();
          console.error(error);
        }
      });
    };

    document.head.appendChild(sdkScript);

    function initializeMap() {
      // 위치를 확인하지 못하면 서울시청을 기본 위치로 사용한다.
      const defaultPosition =
        new kakao.maps.LatLng(37.5665, 126.9780);

      map = new kakao.maps.Map(document.getElementById("map"), {
        center: defaultPosition,
        level: 5
      });

      places = new kakao.maps.services.Places();

      infoWindow = new kakao.maps.InfoWindow({
        removable: true
      });

      // 창 크기가 바뀌면 지도 크기를 다시 계산한다.
      window.addEventListener("resize", () => {
        const center = map.getCenter();
        map.relayout();
        map.setCenter(center);
      });

      statusText.textContent =
        "현재 위치를 확인합니다. 위치 권한을 허용해 주세요.";

      if (!navigator.geolocation) {
        finishLocation(
          "위치 기능을 지원하지 않아 서울시청을 표시합니다."
        );
        return;
      }

      // 브라우저에 위치 권한과 현재 위치를 요청한다.
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(currentPosition);
          map.setLevel(5);

          // 현재 위치에 마커를 표시한다.
          new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: "현재 위치"
          });

          finishLocation(
            "현재 위치를 표시했습니다. 장소를 검색해 보세요."
          );
        },
        (error) => {
          const reason = error.code === 1
            ? "위치 권한이 거부되었습니다."
            : "현재 위치를 확인하지 못했습니다.";

          finishLocation(
            reason + " 서울시청을 기준으로 검색할 수 있습니다."
          );
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // 위치 확인이 끝난 뒤 검색 버튼을 활성화한다.
    function finishLocation(message) {
      ready = true;
      searchButton.disabled = false;
      statusText.textContent = message;
    }

    // 검색 버튼을 누르거나 엔터를 누르면 실행한다.
    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!ready) return;

      const keyword = keywordInput.value.trim();

      if (!keyword) {
        statusText.textContent = "검색어를 입력해 주세요.";
        keywordInput.focus();
        return;
      }

      // 이전 검색 요청과 이번 검색 요청을 구분한다.
      const currentRequest = ++requestId;

      // 이전 결과와 검색 마커를 지운다.
      markers.forEach((marker) => marker.setMap(null));
      markers = [];
      resultList.replaceChildren();
      infoWindow.close();

      statusText.textContent = "장소를 검색하고 있습니다.";

      places.keywordSearch(
        keyword,
        (data, status) => {
          // 이전 검색 응답이 늦게 도착하면 무시한다.
          if (currentRequest !== requestId) return;

          if (status === kakao.maps.services.Status.ZERO_RESULT) {
            statusText.textContent =
              "검색 결과가 없습니다. 다른 검색어를 입력해 주세요.";
            return;
          }

          if (status !== kakao.maps.services.Status.OK) {
            statusText.textContent =
              "검색에 실패했습니다. 잠시 후 다시 시도해 주세요.";
            return;
          }

          data.forEach((place, index) => {
            const position = new kakao.maps.LatLng(
              place.y,
              place.x
            );

            const marker = new kakao.maps.Marker({
              map: map,
              position: position,
              title: place.place_name
            });

            markers.push(marker);

            // 검색 결과 목록에 장소 이름과 주소를 넣는다.
            const item = document.createElement("li");
            const button = document.createElement("button");
            const name = document.createElement("strong");
            const address = document.createElement("span");

            button.type = "button";
            button.className = "place";

            name.textContent =
              (index + 1) + ". " + place.place_name;

            address.textContent =
              place.road_address_name || place.address_name;

            button.append(name, address);
            item.appendChild(button);
            resultList.appendChild(item);

            // 결과나 마커를 클릭하면 장소 이름을 표시하고 이동한다.
            function selectPlace() {
              const content = document.createElement("div");
              content.className = "info";
              content.textContent = place.place_name;

              infoWindow.setContent(content);
              infoWindow.open(map, marker);

              map.setLevel(5);
              map.panTo(position);
            }

            button.addEventListener("click", selectPlace);

            kakao.maps.event.addListener(
              marker,
              "click",
              selectPlace
            );
          });

          // 레벨 5를 유지하며 첫 번째 결과로 이동한다.
          map.setLevel(5);
          map.setCenter(
            new kakao.maps.LatLng(data[0].y, data[0].x)
          );

          statusText.textContent =
            "가까운 순으로 검색 결과 " + data.length +
            "개를 표시합니다(최대 15개). " +
            "목록을 누르면 해당 장소로 이동합니다.";
        },
        {
          // 검색 시점의 지도 중심에서 가까운 순으로 검색한다.
          location: map.getCenter(),
          sort: kakao.maps.services.SortBy.DISTANCE,
          size: 15
        }
      );
    });
  </script>
</body>

            const position = new kakao.maps.LatLng(
              place.y,
              place.x
            );

            const marker = new kakao.maps.Marker({
              map: map,
              position: position,
              title: place.place_name
            });

            markers.push(marker);

            // 검색 결과 목록에 장소 이름과 주소를 넣는다.
            const item = document.createElement("li");
            const button = document.createElement("button");
            const name = document.createElement("strong");
            const address = document.createElement("span");

            button.type = "button";
            button.className = "place";

            name.textContent =
              (index + 1) + ". " + place.place_name;

            address.textContent =
              place.road_address_name || place.address_name;

            button.append(name, address);
            item.appendChild(button);
            resultList.appendChild(item);

            // 결과나 마커를 클릭하면 장소 이름을 표시하고 이동한다.
            function selectPlace() {
              const content = document.createElement("div");
              content.className = "info";
              content.textContent = place.place_name;

              infoWindow.setContent(content);
              infoWindow.open(map, marker);

              map.setLevel(5);
              map.panTo(position);
            }

            button.addEventListener("click", selectPlace);

            kakao.maps.event.addListener(
              marker,
              "click",
              selectPlace
            );
          });

          // 레벨 5를 유지하며 첫 번째 결과로 이동한다.
          map.setLevel(5);
          map.setCenter(
            new kakao.maps.LatLng(data[0].y, data[0].x)
          );

          statusText.textContent =
            "가까운 순으로 검색 결과 " + data.length +
            "개를 표시합니다(최대 15개). " +
            "목록을 누르면 해당 장소로 이동합니다.";
        },
        {
          // 검색 시점의 지도 중심에서 가까운 순으로 검색한다.
          location: map.getCenter(),
          sort: kakao.maps.services.SortBy.DISTANCE,
          size: 15
        }
      );
    });
  </script>
</body>
</html>
